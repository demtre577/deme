<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ღია სამყაროს თავგადასავალი</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <h2>ვესტერიას სტილის სამყარო</h2>
        <p>გამოიყენე <b>W, A, S, D</b> ღილაკები მოსაძრაობად</p>
    </div>

    <!-- Three.js ბიბლიოთეკა 3D გრაფიკისთვის -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // სცენის, კამერის და რენდერის შექმნა
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // ცისფერი ცა
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // განათება (მზე)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // დიდი მიწა (მაპი)
        const floorGeometry = new THREE.PlaneGeometry(500, 500, 50, 50);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x3b7a37, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // გარემო: ხეების დამატება (ტყე)
        const treeGeometry = new THREE.ConeGeometry(2, 6, 8);
        const treeMaterial = new THREE.MeshStandardMaterial({ color: 0x1b4d3e });
        const trunkGeometry = new THREE.CylinderGeometry(0.4, 0.4, 2);
        const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x5c4033 });

        for (let i = 0; i < 150; i++) {
            const x = (Math.random() - 0.5) * 400;
            const z = (Math.random() - 0.5) * 400;
            
            // არ ჩავსვათ ხეები ცენტრთან ახლოს
            if (Math.abs(x) > 10 || Math.abs(z) > 10) {
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.set(x, 1, z);
                scene.add(trunk);

                const foliage = new THREE.Mesh(treeGeometry, treeMaterial);
                foliage.position.set(x, 4, z);
                scene.add(foliage);
            }
        }

        // მოთამაშე (შენი პერსონაჟი - კუბი/გმირი)
        const playerGeometry = new THREE.BoxGeometry(1, 2, 1);
        const playerMaterial = new THREE.MeshStandardMaterial({ color: 0xff3b3b });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        player.position.set(0, 1, 0);
        scene.add(player);

        // კამერის პოზიცია მოთამაშის უკან
        camera.position.set(0, 5, 8);
        camera.lookAt(player.position);

        // კლავიატურის კონტროლი
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // ანიმაციისა და მოძრაობის ლოგიკა
        function animate() {
            requestAnimationFrame(animate);

            // მოთამაშის მოძრაობა
            const speed = 0.2;
            if (keys['w']) player.position.z -= speed;
            if (keys['s']) player.position.z += speed;
            if (keys['a']) player.position.x -= speed;
            if (keys['d']) player.position.x += speed;

            // კამერა მიჰყვება მოთამაშეს
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 8;
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // ეკრანის ზომის შეცვლაზე რეაგირება
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
</body>
</html>
