<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal an Egg - 3D თამაში</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            pointer-events: none;
        }
        h1 { margin: 0 0 10px 0; font-size: 20px; color: #ffcc00; }
        p { margin: 5px 0; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Steal an Egg!</h1>
        <p>მოძრაობა: <b>W, A, S, D</b></p>
        <p>მოპარული კვერცხები: <span id="score">0</span> / 5</p>
    </div>

    <!-- Three.js 3D ბიბლიოთეკა -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // სცენა და კამერა
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // ცა
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // განათება
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // დიდი მინდორი (მაპი)
        const floorGeometry = new THREE.PlaneGeometry(300, 300);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x3b7a37, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // მოთამაშე (შენი პერსონაჟი)
        const playerGeometry = new THREE.BoxGeometry(1, 2, 1);
        const playerMaterial = new THREE.MeshStandardMaterial({ color: 0xff3b3b });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        player.position.set(0, 1, 0);
        scene.add(player);

        // კვერცხები (ობიექტები მოსაპარად)
        const eggs = [];
        const eggGeometry = new THREE.SphereGeometry(0.6, 16, 16);
        eggGeometry.scale(1, 1.3, 1); // კვერცხის ფორმა
        const eggMaterial = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3 }); // ოქროსფერი

        for (let i = 0; i < 5; i++) {
            const egg = new THREE.Mesh(eggGeometry, eggMaterial);
            // შემთხვევითი პოზიცია მინდორზე
            egg.position.set((Math.random() - 0.5) * 150, 0.6, (Math.random() - 0.5) * 150);
            scene.add(egg);
            eggs.push(egg);
        }

        // კამერა მოთამაშის უკან
        camera.position.set(0, 6, 10);
        camera.lookAt(player.position);

        // კლავიატურა
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        let score = 0;

        // თამაშის მთავარი ციკლი (ანიმაცია)
        function animate() {
            requestAnimationFrame(animate);

            // მოთამაშის სიარული
            const speed = 0.25;
            if (keys['w']) player.position.z -= speed;
            if (keys['s']) player.position.z += speed;
            if (keys['a']) player.position.x -= speed;
            if (keys['d']) player.position.x += speed;

            // საზღვრები, რომ მაპიდან არ გადავიდეს
            player.position.x = Math.max(-140, Math.min(140, player.position.x));
            player.position.z = Math.max(-140, Math.min(140, player.position.z));

            // კვერცხების შეგროვების შემოწმება
            eggs.forEach((egg, index) => {
                if (egg.visible) {
                    const distance = player.position.distanceTo(egg.position);
                    if (distance < 1.5) { // თუ მიუახლოვდი
                        egg.visible = false; // გააქრობს კვერცხს
                        score++;
                        document.getElementById('score').innerText = score;
                        
                        if (score === 5) {
                            alert("გილოცავ! ყველა კვერცხი მოიპარე!");
                        }
                    }
                }
            });

            // კამერა მიჰყვება პერსონაჟს
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 10;
            camera.lookAt(player.position.x, player.position.y, player.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // ეკრანის ზომის ცვლილება
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
</body>
</html>
